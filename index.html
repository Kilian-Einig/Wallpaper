<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eye Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: system-ui;
        }

        #container {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 60px 80px;
            padding: 80px;
            align-items: center;
            justify-items: center;
        }

        #container.single-mode {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            padding: 0;
        }

        #container.double-mode {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 80px;
            padding: 0;
        }

        .eye-wrapper {
            position: relative;
            width: 60px;
            height: 60px;
            transition: none;
        }

        .eye-wrapper.large {
            width: 200px;
            height: 200px;
        }

        .eye {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: blink-grid 4s infinite;
        }

        .eye.large {
            width: 200px;
            height: 200px;
        }

        .eye.blink {
            animation: blink 4s infinite;
        }

        @keyframes blink-grid {
            0% { scaleY(1); }
            48% { scaleY(1); }
            50% { scaleY(0.05); }
            52% { scaleY(1); }
            100% { scaleY(1); }
        }

        @keyframes blink {
            0% { height: 200px; }
            48% { height: 200px; }
            50% { height: 10px; }
            52% { height: 200px; }
            100% { height: 200px; }
        }

        .pupil {
            width: 20px;
            height: 20px;
            background: #0066ff;
            border-radius: 50%;
            position: absolute;
        }

        .pupil.large {
            width: 66px;
            height: 66px;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #0066ff;
            padding: 20px;
            border-radius: 12px;
            color: white;
            font-size: 13px;
            z-index: 1000;
            width: 320px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .controls.collapsed {
            width: auto;
            padding: 10px 15px;
        }

        .controls.collapsed .control-group,
        .controls.collapsed .info {
            display: none;
        }

        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .controls h3 {
            margin: 0;
            font-size: 15px;
            font-weight: bold;
        }

        .collapse-btn {
            background: none;
            border: none;
            color: #0066ff;
            font-size: 18px;
            cursor: pointer;
            padding: 0;
            width: auto;
        }

        .collapse-btn:hover {
            color: #0052cc;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 500;
        }

        .control-group span {
            color: #0066ff;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
            height: 6px;
            accent-color: #0066ff;
        }

        input[type="color"] {
            width: 100%;
            height: 40px;
            cursor: pointer;
            border: 2px solid #0066ff;
            border-radius: 6px;
        }

        select {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 2px solid #0066ff;
            background: #1a1a1a;
            color: white;
            cursor: pointer;
            font-size: 12px;
        }

        select option {
            background: #1a1a1a;
            color: white;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #0066ff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: #0052cc;
        }

        .info {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #333;
            font-size: 12px;
            opacity: 0.8;
        }

        .controls::-webkit-scrollbar {
            width: 6px;
        }

        .controls::-webkit-scrollbar-track {
            background: transparent;
        }

        .controls::-webkit-scrollbar-thumb {
            background: #0066ff;
            border-radius: 3px;
        }

        .controls::-webkit-scrollbar-thumb:hover {
            background: #0052cc;
        }
    </style>
</head>
<body>
    <div id="container"></div>

    <div class="controls" id="controlPanel">
        <div class="controls-header">
            <h3>👀 Eye Tracker</h3>
            <button class="collapse-btn" onclick="toggleControls()">−</button>
        </div>

        <div class="control-group">
            <label>Modus</label>
            <select id="modeSelect" onchange="changeMode(this.value)">
                <option value="grid">📊 Grid (viele Augen)</option>
                <option value="double">👀 Zwei Augen (blinzelnd)</option>
                <option value="single">👁️ Einzelnes Auge (blinzelnd)</option>
            </select>
        </div>

        <div class="control-group" id="countGroup">
            <label>Anzahl: <span id="countDisplay">40</span></label>
            <input type="range" id="countSlider" min="4" max="100" value="40">
        </div>

        <div class="control-group" id="sizeGroup">
            <label>Größe: <span id="sizeDisplay">60</span>px</label>
            <input type="range" id="sizeSlider" min="20" max="120" value="60">
        </div>

        <div class="control-group">
            <label>Farbe</label>
            <input type="color" id="colorPicker" value="#0066ff">
        </div>

        <button onclick="resetTracking()">↻ Reset</button>

        <div class="info">
            💡 Augen folgen der Maus
        </div>
    </div>

    <script>
        let eyeWrappers = [];
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let currentMode = 'grid';

        function createEyes(count) {
            const container = document.getElementById('container');
            container.innerHTML = '';
            container.classList.remove('single-mode');
            container.classList.remove('double-mode');
            eyeWrappers = [];

            const size = parseInt(document.getElementById('sizeSlider').value);
            const color = document.getElementById('colorPicker').value;
            const cols = Math.ceil(Math.sqrt(count));

            container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

            for (let i = 0; i < count; i++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'eye-wrapper';
                wrapper.style.width = size + 'px';
                wrapper.style.height = size + 'px';

                const eye = document.createElement('div');
                eye.className = 'eye';
                eye.style.width = size + 'px';
                eye.style.height = size + 'px';
                eye.style.animationDelay = (i * 0.15) + 's';

                const pupilSize = size * 0.33;
                const pupil = document.createElement('div');
                pupil.className = 'pupil';
                pupil.style.width = pupilSize + 'px';
                pupil.style.height = pupilSize + 'px';
                pupil.style.background = color;

                eye.appendChild(pupil);
                wrapper.appendChild(eye);
                container.appendChild(wrapper);

                eyeWrappers.push({
                    wrapper: wrapper,
                    eye: eye,
                    pupil: pupil,
                    size: size,
                    pupilSize: pupilSize,
                    index: i
                });
            }
        }

        function createSingleEye() {
            const container = document.getElementById('container');
            container.innerHTML = '';
            container.classList.remove('double-mode');
            container.classList.add('single-mode');
            eyeWrappers = [];

            const color = document.getElementById('colorPicker').value;
            const size = 200;

            const wrapper = document.createElement('div');
            wrapper.className = 'eye-wrapper large';
            wrapper.style.width = size + 'px';
            wrapper.style.height = size + 'px';

            const eye = document.createElement('div');
            eye.className = 'eye large blink';
            eye.style.width = size + 'px';
            eye.style.height = size + 'px';

            const pupilSize = size * 0.33;
            const pupil = document.createElement('div');
            pupil.className = 'pupil large';
            pupil.style.width = pupilSize + 'px';
            pupil.style.height = pupilSize + 'px';
            pupil.style.background = color;

            eye.appendChild(pupil);
            wrapper.appendChild(eye);
            container.appendChild(wrapper);

            eyeWrappers.push({
                wrapper: wrapper,
                eye: eye,
                pupil: pupil,
                size: size,
                pupilSize: pupilSize,
                index: 0
            });
        }

        function createDoubleEyes() {
            const container = document.getElementById('container');
            container.innerHTML = '';
            container.classList.remove('single-mode');
            container.classList.add('double-mode');
            eyeWrappers = [];

            const color = document.getElementById('colorPicker').value;
            const size = 200;

            for (let eyeIndex = 0; eyeIndex < 2; eyeIndex++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'eye-wrapper large';
                wrapper.style.width = size + 'px';
                wrapper.style.height = size + 'px';

                const eye = document.createElement('div');
                eye.className = 'eye large blink';
                eye.style.width = size + 'px';
                eye.style.height = size + 'px';
                eye.style.animationDelay = (eyeIndex * 0.1) + 's';

                const pupilSize = size * 0.33;
                const pupil = document.createElement('div');
                pupil.className = 'pupil large';
                pupil.style.width = pupilSize + 'px';
                pupil.style.height = pupilSize + 'px';
                pupil.style.background = color;

                eye.appendChild(pupil);
                wrapper.appendChild(eye);
                container.appendChild(wrapper);

                eyeWrappers.push({
                    wrapper: wrapper,
                    eye: eye,
                    pupil: pupil,
                    size: size,
                    pupilSize: pupilSize,
                    index: eyeIndex
                });
            }
        }

        function changeMode(mode) {
            currentMode = mode;

            if (mode === 'single') {
                createSingleEye();
                document.getElementById('countGroup').style.display = 'none';
                document.getElementById('sizeGroup').style.display = 'none';
            } else if (mode === 'double') {
                createDoubleEyes();
                document.getElementById('countGroup').style.display = 'none';
                document.getElementById('sizeGroup').style.display = 'none';
            } else {
                document.getElementById('countGroup').style.display = 'block';
                document.getElementById('sizeGroup').style.display = 'block';
                const count = parseInt(document.getElementById('countSlider').value);
                createEyes(count);
            }
        }

        function updateAnimation() {
            eyeWrappers.forEach((item) => {
                const rect = item.wrapper.getBoundingClientRect();
                const eyeCenterX = rect.left + item.size / 2;
                const eyeCenterY = rect.top + item.size / 2;

                const dx = mouseX - eyeCenterX;
                const dy = mouseY - eyeCenterY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance === 0) return;

                const angle = Math.atan2(dy, dx);

                const maxMove = (item.size - item.pupilSize) / 2;

                const moveX = Math.cos(angle) * maxMove;
                const moveY = Math.sin(angle) * maxMove;

                const basePupilX = (item.size - item.pupilSize) / 2;
                const basePupilY = (item.size - item.pupilSize) / 2;

                item.pupil.style.left = (basePupilX + moveX) + 'px';
                item.pupil.style.top = (basePupilY + moveY) + 'px';
            });

            requestAnimationFrame(updateAnimation);
        }

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        document.getElementById('countSlider').addEventListener('input', (e) => {
            const count = parseInt(e.target.value);
            document.getElementById('countDisplay').textContent = count;
            createEyes(count);
        });

        document.getElementById('sizeSlider').addEventListener('input', (e) => {
            const size = parseInt(e.target.value);
            document.getElementById('sizeDisplay').textContent = size;
            createEyes(parseInt(document.getElementById('countSlider').value));
        });

        document.getElementById('colorPicker').addEventListener('change', (e) => {
            const color = e.target.value;
            eyeWrappers.forEach(item => {
                item.pupil.style.background = color;
            });
        });

        function resetTracking() {
            mouseX = window.innerWidth / 2;
            mouseY = window.innerHeight / 2;
        }

        function toggleControls() {
            const panel = document.getElementById('controlPanel');
            panel.classList.toggle('collapsed');
            const btn = panel.querySelector('.collapse-btn');
            btn.textContent = panel.classList.contains('collapsed') ? '+' : '−';
        }

        createEyes(40);
        updateAnimation();
    </script>
</body>
</html>
